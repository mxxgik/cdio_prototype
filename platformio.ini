; ---------------------------------------------------------------------------
; platformio.ini — PlatformIO build configuration
;
; WHY THIS FILE EXISTS:
; PlatformIO reads this file to know (1) which board we are flashing,
; (2) which framework/library ecosystem to use, and (3) which third-party
; libraries the project needs. Because it is committed with the code,
; anyone who clones this repository builds exactly the same firmware.
;
; Key lines explained:
;   platform  = espressif32 ... downloads the Xtensa compiler + ESP32 cores
;   board     = esp32dev ..... the generic ESP32 DevKit (most common clone)
;   framework = arduino ...... we program it with the Arduino API (setup/loop)
;   board_build.filesystem = littlefs
;               uploads the `data/` folder to flash as a little filesystem,
;               so the program can read field_data.json at runtime
;   lib_deps  ......... ArduinoJson: JSON parser for the data file
; ---------------------------------------------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
